<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafafa">
  <link id="brand-favicon" rel="icon" type="image/svg+xml" href="data:,">
  <title>%VITE_APP_TITLE%</title>
  <style>
    html, body, #app { min-height: 100%; margin: 0; }
    body { background: #fafafa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; color: #202124; }
    .initial-loading { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    .initial-loading strong { font-size: 17px; font-weight: 600; }
    .initial-loading p { color: #737880; font-size: 13px; margin: 0; }
    .initial-spinner { width: 28px; height: 28px; margin-bottom: 8px; border: 2px solid #e5e7eb; border-top-color: #f6821f; border-radius: 50%; animation: loading .8s linear infinite; }
    @keyframes loading { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .initial-spinner { animation: none; } }
  </style>
</head>
<body>
  <div id="app">
    <div class="initial-loading" role="status" aria-live="polite">
      <div class="initial-spinner" aria-hidden="true"></div>
      <strong>%VITE_APP_BRAND_NAME%管理控制台</strong>
      <p>正在载入工作空间…</p>
    </div>
  </div>
  <noscript>请启用 JavaScript 以使用管理控制台。</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
