name: hongshu

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: hongshu_springboot
      MYSQL_USER: hongshu
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./HongShu-backend/sql/hongshu_mock.sql:/docker-entrypoint-initdb.d/01-hongshu.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u hongshu hongshu_springboot -e 'SELECT 1 FROM sys_config LIMIT 1'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: ${NGINX_IMAGE:-nginx:1.28-alpine}
    pull_policy: missing
    restart: unless-stopped
    environment:
      BACKEND_PORT: ${API_PORT:-8080}
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    volumes:
      - ./HongShu-Ui/hongshu-web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/templates/default.conf.template:ro

  admin:
    image: ${NGINX_IMAGE:-nginx:1.28-alpine}
    pull_policy: missing
    restart: unless-stopped
    environment:
      BACKEND_PORT: ${API_PORT:-8080}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8082}:80"
    volumes:
      - ./HongShu-Ui/hongshu-admin/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/templates/default.conf.template:ro

volumes:
  mysql-data:
  redis-data:
