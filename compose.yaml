name: hongshu

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: ${IMAGE_PREFIX:-hongshu}-mysql:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: hongshu_springboot
      MYSQL_USER: hongshu
      MYSQL_PASSWORD: ${DB_PASSWORD:?请配置 DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请配置 MYSQL_ROOT_PASSWORD}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u hongshu hongshu_springboot -e 'SELECT 1 FROM sys_config LIMIT 1'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *logging

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请配置 REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  backend:
    image: ${IMAGE_PREFIX:-hongshu}-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    mem_limit: ${BACKEND_MEMORY_LIMIT:-2g}
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70.0 -XX:InitialRAMPercentage=25.0 -XX:+ExitOnOutOfMemoryError}
      SERVER_PORT: "8080"
      SERVER_ADDRESS: 0.0.0.0
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_TOMCAT_THREADS_MAX: "200"
      SERVER_TOMCAT_THREADS_MIN_SPARE: "10"
      SPRING_CONFIG_LOCATION: file:/app/config/application.yml
      SPRING_DEVTOOLS_RESTART_ENABLED: "false"
      LOGGING_LEVEL_COM_HONGSHU: info
      HONGSHU_PROFILE: /app/upload
      DB_URL: jdbc:mysql://mysql:3306/hongshu_springboot?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: hongshu
      DB_PASSWORD: ${DB_PASSWORD:?请配置 DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请配置 REDIS_PASSWORD}
      HONGSHU_ADMIN_USERNAME: ${HONGSHU_ADMIN_USERNAME:?请配置 HONGSHU_ADMIN_USERNAME}
      HONGSHU_ADMIN_PASSWORD: ${HONGSHU_ADMIN_PASSWORD:?请配置 HONGSHU_ADMIN_PASSWORD}
      HONGSHU_JWT_APP_SECRET: ${HONGSHU_JWT_APP_SECRET:?请配置 HONGSHU_JWT_APP_SECRET}
      TOKEN_SECRET: ${TOKEN_SECRET:?请配置 TOKEN_SECRET}
      OSS_ENDPOINT: ${OSS_ENDPOINT:?请配置 OSS_ENDPOINT}
      OSS_REGION: ${OSS_REGION:?请配置 OSS_REGION}
      OSS_BUCKET: ${OSS_BUCKET:?请配置 OSS_BUCKET}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:?请配置 OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:?请配置 OSS_ACCESS_KEY_SECRET}
      OSS_PUBLIC_URL: ${OSS_PUBLIC_URL:-}
      SWAGGER_CONFIG_URL: /prod-api/v3/api-docs/swagger-config
      SWAGGER_API_URL: /prod-api/v3/api-docs
      SWAGGER_PATHMAPPING: /prod-api
    volumes:
      - backend-upload:/app/upload
      - backend-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    logging: *logging

  web:
    image: ${IMAGE_PREFIX:-hongshu}-web:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging

  admin:
    image: ${IMAGE_PREFIX:-hongshu}-admin:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${ADMIN_PORT:-8082}:80"
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging

volumes:
  mysql-data:
  redis-data:
  backend-upload:
  backend-logs:
